name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print Prettier output for runtime files
        run: |
          pnpm exec prettier --write apps/creator/src/app.tsx packages/invitation-components/src/audio-component.tsx packages/invitation-components/src/choice-component.tsx packages/invitation-components/src/countdown-component.tsx packages/invitation-components/src/experience-renderer.tsx packages/invitation-components/src/guestbook-component.tsx packages/invitation-components/src/renderer-styles.ts packages/invitation-components/src/reveal-component.tsx packages/invitation-components/src/scene-component-view.tsx packages/invitation-components/src/scene-view.tsx packages/invitation-components/src/timeline-component.tsx packages/invitation-runtime/src/index.ts
          git diff -- apps/creator/src/app.tsx packages/invitation-components/src/audio-component.tsx packages/invitation-components/src/choice-component.tsx packages/invitation-components/src/countdown-component.tsx packages/invitation-components/src/experience-renderer.tsx packages/invitation-components/src/guestbook-component.tsx packages/invitation-components/src/renderer-styles.ts packages/invitation-components/src/reveal-component.tsx packages/invitation-components/src/scene-component-view.tsx packages/invitation-components/src/scene-view.tsx packages/invitation-components/src/timeline-component.tsx packages/invitation-runtime/src/index.ts
          exit 1

  spellcheck:
    name: Spellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm spellcheck

  typecheck:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @invite/storybook exec playwright install --with-deps chromium
      - run: pnpm --filter @invite/storybook test:ci

  build:
    name: Build Apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
