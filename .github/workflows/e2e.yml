name: E2E Browser Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @invite/storybook exec playwright install --with-deps chromium
      - name: Run E2E when a browser project exists
        run: |
          if find apps -name 'playwright.config.*' -o -name '*e2e*.test.ts' | grep -q .; then
            pnpm --filter @invite/storybook exec playwright test
          else
            echo "No Playwright application suite yet; workflow is scaffolded."
          fi
