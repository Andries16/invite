name: Production Deployment

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v5
      - name: Production deployment contract
        run: |
          echo "Production deployment is scaffolded."
          echo "Attach registry/hosting credentials through GitHub Environment secrets."
