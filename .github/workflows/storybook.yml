name: Storybook

on:
  pull_request:
    paths:
      - "apps/storybook/**"
      - "packages/design-system/**"
      - "packages/invitation-components/**"
      - ".storybook/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @invite/storybook typecheck
      - run: pnpm --filter @invite/storybook test:ci
      - run: pnpm --filter @invite/storybook build
